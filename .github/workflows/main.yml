name: Build Gotham gazette Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download apktool
        run: wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
      - name: Decode Android shell
        run: java -jar apktool.jar d -f base/app-debug.apk -o work
      - name: Ensure network permission for AI providers
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p = 'work/AndroidManifest.xml'
          tree = ET.parse(p)
          root = tree.getroot()
          ns = 'http://schemas.android.com/apk/res/android'
          name = '{%s}name' % ns
          if not any(x.tag.endswith('uses-permission') and x.get(name) == 'android.permission.INTERNET' for x in root):
              node = ET.Element('uses-permission')
              node.set(name, 'android.permission.INTERNET')
              root.insert(0, node)
          ET.register_namespace('android', ns)
          tree.write(p, encoding='utf-8', xml_declaration=True)
          PY
      - name: Install Gotham gazette web app and resources
        run: |
          mkdir -p work/assets/public
          cp -r www/. work/assets/public/
          while IFS= read -r f; do
            target="work/res/${f#./}"
            mkdir -p "$(dirname "$target")"
            cp "android-res/$f" "$target"
          done < <(cd android-res && find . -type f \( -name '*.png' -o -name '*.xml' \))
          cp android-res/values/strings.xml work/res/values/strings.xml
      - name: Rebuild APK
        run: java -jar apktool.jar b work -o unsigned.apk
      - name: Align and sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="
